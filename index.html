<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Doğrulama Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(88, 101, 242, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                #0a0a0a;
            z-index: 0;
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .light-effect {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 255, 136, 0.03) 0%, transparent 70%);
            animation: pulseLight 8s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulseLight {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            border-radius: 40px;
            padding: 60px 50px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.08);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 40%, #00ff88 70%, #00cc66 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            letter-spacing: 8px;
            text-shadow: 0 0 60px rgba(0, 255, 136, 0.15);
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-sub {
            font-family: 'Rajdhani', sans-serif;
            color: #445566;
            font-size: 13px;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-top: -5px;
            font-weight: 600;
        }

        .logo-sub .highlight {
            color: #00ff88;
        }

        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
            margin: 20px auto;
        }

        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Rajdhani', sans-serif;
        }

        .title .highlight {
            color: #00ff88;
        }

        .subtitle {
            color: #8899aa;
            font-size: 16px;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 50px;
            padding: 10px 25px;
            margin: 15px auto 25px;
            width: fit-content;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .status-text {
            color: #00ff88;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 10px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: rgba(0, 255, 136, 0.15);
            transform: translateY(-3px);
        }

        .feature-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .feature-item .label {
            color: #667788;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .feature-item .value {
            color: #00ff88;
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
        }

        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: loadingMove 2s ease-in-out infinite;
        }

        @keyframes loadingMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .loading-text {
            color: #445566;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0a;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.3);
        }

        .btn-discord:active {
            transform: scale(0.98);
        }

        .btn-discord .arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn-discord:hover .arrow {
            transform: translateX(5px);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            color: #334455;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .footer .highlight {
            color: #00ff88;
            font-weight: 600;
        }

        .footer-version {
            color: #223344;
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
                border-radius: 30px;
                margin: 20px;
            }

            .logo {
                font-size: 48px;
                letter-spacing: 4px;
            }

            .logo-sub {
                font-size: 11px;
                letter-spacing: 8px;
            }

            .title {
                font-size: 22px;
            }

            .features {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .feature-item {
                padding: 12px 8px;
            }

            .feature-item .icon {
                font-size: 22px;
            }

            .btn-discord {
                padding: 12px 30px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }

            .status-container {
                padding: 8px 18px;
            }

            .loading-bar {
                width: 120px;
            }
        }

        @media (max-width: 400px) {
            .features {
                grid-template-columns: 1fr 1fr;
            }

            .logo {
                font-size: 38px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-lines"></div>
    <div class="light-effect"></div>

    <div class="container">
        <div class="logo">AURA</div>
        <div class="logo-sub"><span class="highlight">✦</span> SCRIPT HUB <span class="highlight">✦</span></div>

        <div class="divider"></div>

        <h1 class="title">
            <span class="highlight">●</span> Doğrulama Sistemi
        </h1>
        <p class="subtitle">Güvenli giriş ile sunucuya katılın</p>

        <div class="status-container">
            <span class="status-dot"></span>
            <span class="status-text">Sistem Aktif • 7/24</span>
        </div>

        <div class="features">
            <div class="feature-item">
                <span class="icon">🔐</span>
                <div class="label">Güvenlik</div>
                <div class="value">OAuth2</div>
            </div>
            <div class="feature-item">
                <span class="icon">⚡</span>
                <div class="label">Hız</div>
                <div class="value">Anında</div>
            </div>
            <div class="feature-item">
                <span class="icon">🛡️</span>
                <div class="label">Koruma</div>
                <div class="value">Premium</div>
            </div>
        </div>

        <div class="loading-container">
            <div class="loading-bar"></div>
            <span class="loading-text" id="timeDisplay">BAĞLANIYOR</span>
            <div class="loading-bar"></div>
        </div>

        <a href="#" class="btn-discord" id="mainBtn">
            <span>Discord'da Doğrula</span>
            <span class="arrow">→</span>
        </a>

        <div class="footer">
            <span class="highlight">★</span> AURA SCRIPT HUB v3.0 <span class="highlight">★</span>
            <div class="footer-version">POWERED BY AURA SECURITY</div>
        </div>
    </div>

    <script>
        document.getElementById('mainBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'https://discord.com/oauth2/authorize?client_id=1519514296101638305&permissions=8&scope=bot%20applications.commands';
        });

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                container.style.transition = 'all 1s cubic-bezier(0.23, 1, 0.32, 1)';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });

        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('tr-TR', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('timeDisplay').textContent = `● ${time}`;
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
